<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f6f8" />
    <meta name="description" content="A simple checkout for two everyday essentials." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Checkout | Everyday Goods</title>
  </head>
  <body>
    <div class="page-shell">
      <header class="page-header">
        <p class="eyebrow">EVERYDAY GOODS</p>
        <h1>Checkout</h1>
        <p class="page-intro">A few essentials, ready when you are.</p>
      </header>

      <main class="checkout-layout">
        <section class="panel catalog-panel" aria-labelledby="products-heading">
          <div class="section-heading">
            <div>
              <p class="eyebrow">THE COLLECTION</p>
              <h2 id="products-heading">Products</h2>
            </div>
            <span class="item-count">2 items</span>
          </div>
          <div id="product-list" class="product-list"></div>
        </section>

        <section class="panel order-panel" aria-labelledby="order-heading">
          <div class="section-heading">
            <div>
              <p class="eyebrow">YOUR SELECTION</p>
              <h2 id="order-heading">Your order</h2>
            </div>
          </div>

          <section aria-labelledby="cart-heading">
            <h3 id="cart-heading" class="subheading">Shopping cart</h3>
            <div id="cart-items" class="cart-items"></div>
            <p class="error" id="cart-error" role="alert" hidden></p>
          </section>

          <div class="order-total" aria-live="polite">
            <span>Order total</span>
            <strong id="order-total" data-testid="order-total">₹0</strong>
          </div>

          <form id="checkout-form" novalidate>
            <div class="field">
              <label for="customer-name">Customer name <span aria-hidden="true">*</span></label>
              <input
                id="customer-name"
                name="customerName"
                type="text"
                autocomplete="name"
                required
                aria-describedby="name-error"
              />
              <p class="error" id="name-error" role="alert" hidden></p>
            </div>
            <div class="actions">
              <button id="place-order" class="primary-button" type="submit">Place Order</button>
              <button id="new-order" class="secondary-button" type="button" hidden>Start New Order</button>
            </div>
            <section
              id="confirmation"
              class="confirmation"
              role="status"
              aria-live="polite"
              aria-labelledby="confirmation-heading"
              hidden
            >
              <h3 id="confirmation-heading">Order confirmed</h3>
              <p>Order placed successfully!</p>
              <p>Customer name: <strong id="confirmation-customer"></strong></p>
              <p>Order reference: <strong id="order-reference"></strong></p>
              <p>Order total: <strong id="confirmation-total"></strong></p>
            </section>
          </form>
        </section>
      </main>
      <footer class="page-footer"><p>Simple essentials. Thoughtfully chosen.</p></footer>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
